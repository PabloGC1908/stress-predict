server:
  port: 8082

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: core-service
          uri: 'http://localhost:8081'
          predicates:
            - Path=/api/auth/**, /api/roles/**, /api/usuarios/**
          filters:
            - name: AuthenticationFilter

        - id: ml-service
          uri: 'http://localhost:8000'
          predicates:
            - Path=/api/ml/**

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "**"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

security:
  jwt:
    privateKey: 4a0d045593e609435c401089d91421cca7ce6a47425b6541b84f8ef9546955f4